name: CI – FastAPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:

  linting:
    runs-on: ubuntu-24.04
    steps:

      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Installer Flake8
      - name: Install flake8
        run: |
          pip install flake8

      # Vérifier les erreurs bloquantes
      - name: Lint with flake8
        run: |
          flake8 app Tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app Tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

  test:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installer les dépendances de développement
      - name: Install dependencies dev
        run: |
          python -m pip install -upgrade pip
          pip install -r requirements-dev.txt
          pip list
      # Tests unitaires / async
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -q

  SafetyScan:
    runs-on: ubuntu-24.04
    steps:

      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Vérifier la sécurité des dépendances
      - name: Check for security issues
        run: |
          pip install safety
          safety scan || true