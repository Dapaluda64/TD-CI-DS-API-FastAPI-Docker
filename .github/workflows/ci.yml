name: CI – FastAPI
 
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read
 
jobs:
  linting:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Linting – qualité du code
      - name: lint with flake8
        run: |
          pip install flake8
          flake8 app Tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app Tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" 
  test:
      runs-on: ubuntu-24.04
      steps:
      # Tests unitaires / async
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -q 
  SafetyScan:
    runs-on: ubuntu-24.04
    steps:
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # vérifier la sécurité des dépendances 
      - name: check for security issues
        run: |
          pip install safety
          safety scan || true